name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # API vitest specs use mocked Prisma/services — no live Postgres required.
      - name: API unit tests
        run: pnpm --filter @schoolos/api test

      # Mobile policy/client tests run via tsx — no native build or emulator.
      - name: Mobile unit tests
        run: pnpm --filter @schoolos/mobile test

      # Web has no package.json test script; run self-contained tsx policy tests.
      - name: Web unit tests
        run: |
          for test_file in apps/web/__tests__/*.test.ts; do
            echo "Running ${test_file}"
            pnpm exec tsx "${test_file}"
          done
